traefik_domain: "traefik.{{ traefik_acme_domain }}"
traefik_acme_domain: home-lorenzen.de
traefik_challenge: dns
traefik_dashboard_middleware: lan-only
traefik_lan_only_sourcerange: "192.168.10.0/22, 192.168.2.0/24, 172.16.0.0/12, 192.168.13.0/24"
traefik_metrics: true
traefik_dynamic_configs:
  - servers-transports.yml
  - homeassistant.yml

# Home Assistant (eigene VM) von außen per mTLS, siehe templates/conf/dynamic/homeassistant.yml.j2
traefik_homeassistant_domain: ha.nlor.de
traefik_homeassistant_upstream: https://192.168.10.70:8123
traefik_homeassistant_servername: homeassistant.home-lorenzen.de
# Öffentliches CA-Zertifikat (ca.crt aus scripts/mtls_ca.sh), der CA-Schlüssel liegt in Vaultwarden
