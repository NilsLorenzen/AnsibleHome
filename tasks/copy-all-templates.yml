# Dateien die mit nr_ beginnen, lösen keinen Restart aus.
# *.service.j2 landen in /etc/systemd/system, *-logrotate.j2 in /etc/logrotate.d, nicht im Datenverzeichnis.
# file_mode (Default '664') gilt für alle Dateien im Datenverzeichnis, z.B. '640' bei Secrets in der Compose-Datei.
# copy_exclude: Liste von Pfaden relativ zu templates/ (z.B. ['resolv.conf.j2']), die hier komplett
# ignoriert werden, weil die Rolle sie selbst an einen anderen Ort schreibt.

- name: Copy systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '644'
  when:
    - item.state == 'file'
    - item.path not in (copy_exclude | default([]))
    - item.path.endswith('.service.j2')
  with_community.general.filetree: "{{ directory }}"
  loop_control:
    label: "{{ item.path }}"
  notify: "{{ notify_handlers | default(omit) }}"

- name: Copy logrotate configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/logrotate.d/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '644'
  when:
    - item.state == 'file'
    - item.path not in (copy_exclude | default([]))
    - item.path.endswith('-logrotate.j2')
  with_community.general.filetree: "{{ directory }}"
  loop_control:
    label: "{{ item.path }}"

- name: Create root directory
  ansible.builtin.file:
    path: "{{ target | default(root) }}"
    state: directory
    mode: '755'
  notify: "{{ notify_handlers | default(omit) }}"

- name: Create directories
  ansible.builtin.file:
    path: "{{ target | default(root) }}/{{ item.path }}"
    state: directory
    mode: '755'
  when: item.state == 'directory'
  with_community.general.filetree: "{{ directory }}"
  loop_control:
    label: "{{ item.path }}"
  notify: "{{ notify_handlers | default(omit) }}"

- name: Copy non-template files (no restart, prefix nr_)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ target | default(root) }}/{{ item.path
                                           | regex_replace('(^|.*/)(nr_)([^/]+)$', '\\1\\3') }}"
    mode: "{{ file_mode | default('664') }}"
  when:
    - item.state == 'file'
    - item.path not in (copy_exclude | default([]))
    - not item.path.endswith('.j2')
    - item.path | basename != '.gitignore'
    - item.path | basename != '.DS_Store'
    - item.path | basename is match('^nr_')
  with_community.general.filetree: "{{ directory }}"
  loop_control:
    label: "{{ item.path }}"

- name: Copy non-template files (with restart)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ target | default(root) }}/{{ item.path }}"
    mode: "{{ file_mode | default('664') }}"
  when:
    - item.state == 'file'
    - item.path not in (copy_exclude | default([]))
    - not item.path.endswith('.j2')
    - item.path | basename != '.gitignore'
    - item.path | basename != '.DS_Store'
    - not (item.path | basename is match('^nr_'))
  with_community.general.filetree: "{{ directory }}"
  loop_control:
    label: "{{ item.path }}"
  notify: "{{ notify_handlers | default(omit) }}"

- name: Copy template files (no restart, prefix nr_)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ target | default(root) }}/{{ (item.path
                                            | regex_replace('\\.j2$', '')
                                            | regex_replace('(^|.*/)(nr_)([^/]+)$', '\\1\\3')) }}"
    mode: "{{ file_mode | default('664') }}"
    lstrip_blocks: true
  when:
    - item.state == 'file'
    - item.path not in (copy_exclude | default([]))
    - item.path.endswith('.j2')
    - not item.path.endswith('.service.j2')
    - not item.path.endswith('-logrotate.j2')
    - item.path | basename != '.gitignore'
    - item.path | basename != '.DS_Store'
    - item.path | basename is match('^nr_')
  with_community.general.filetree: "{{ directory }}"
  loop_control:
    label: "{{ item.path }}"

- name: Copy template files (with restart)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ target | default(root) }}/{{ item.path | regex_replace('\\.j2$', '') }}"
    mode: "{{ file_mode | default('664') }}"
    lstrip_blocks: true
  when:
    - item.state == 'file'
    - item.path not in (copy_exclude | default([]))
    - item.path.endswith('.j2')
    - not item.path.endswith('.service.j2')
    - not item.path.endswith('-logrotate.j2')
    - item.path | basename != '.gitignore'
    - item.path | basename != '.DS_Store'
    - not (item.path | basename is match('^nr_'))
  with_community.general.filetree: "{{ directory }}"
  loop_control:
    label: "{{ item.path }}"
  notify: "{{ notify_handlers | default(omit) }}"
