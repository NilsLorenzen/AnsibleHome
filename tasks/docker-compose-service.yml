# Gemeinsamer Ablauf für Docker-Compose-Dienste, Aufruf aus einer Rolle:
#
#   - name: Deploy {{ role_name }}
#     ansible.builtin.import_tasks: docker-compose-service.yml
#
# Schreibt die gemeinsame systemd-Unit (templates/docker-compose.service.j2), kopiert alle
# Templates der Rolle (siehe copy-all-templates.yml), startet den Service bei Änderungen
# sofort neu und stellt sicher, dass er läuft und beim Boot startet. Die Rolle braucht
# dafür nur den Handler "restart {{ role_name }}.service" (mit daemon_reload).
#
# Parameter (werden an copy-all-templates.yml durchgereicht): file_mode (Default '644')
# für die Dateien in /data/<rolle>, copy_exclude für Templates, die die Rolle selbst schreibt.
# Unit-Varianten über service_description, service_requires_mounts_for, service_restart.
# Eine Rolle mit eigenem templates/<rolle>.service.j2 behält ihre eigene Unit.

- name: copy {{ role_name }} systemd unit
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/docker-compose.service.j2"
    dest: "/etc/systemd/system/{{ role_name }}.service"
    owner: root
    group: root
    mode: '644'
    lstrip_blocks: true
  when: not (role_path ~ '/templates/' ~ role_name ~ '.service.j2') is file
  notify: restart {{ role_name }}.service

- name: Copy templates
  ansible.builtin.import_tasks: copy-all-templates.yml
  vars:
    directory: ../templates
    notify_handlers: restart {{ role_name }}.service

# Handler hier statt am Ende des Plays abarbeiten: so ist der Restart erledigt, bevor
# der Start-Task läuft, und ein frisch gestarteter Service wird nicht gleich wieder
# neu gestartet. Achtung: flush_handlers arbeitet auch anstehende Handler früherer Rollen ab.
# (meta-Tasks rendern keine Variablen im Namen, deshalb ohne role_name)
- name: Restart service if its files changed
  ansible.builtin.meta: flush_handlers

- name: start {{ role_name }}.service
  ansible.builtin.systemd:
    name: "{{ role_name }}.service"
    state: started
    enabled: true
    daemon_reload: true
