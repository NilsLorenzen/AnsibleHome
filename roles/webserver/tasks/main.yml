# Checkout vor dem Deploy: ein neuer Stand löst den Restart aus, und der
# gemeinsame Ablauf arbeitet ihn per flush_handlers vor dem Start-Task ab.
- name: create /data/webserver/data dir
  ansible.builtin.file:
    path: "{{ root }}/data"
    state: directory
    mode: '755'

# force, damit lokale Abweichungen verworfen werden statt den Task scheitern
# zu lassen. Vorher wurde dafuer das ganze Verzeichnis geloescht und neu
# geklont, was bei jedem Lauf einen Restart ausgeloest hat.
- name: Git checkout from n1ls.wtf repo
  ansible.builtin.git:
    repo: "{{ webserver_git_repo }}"
    dest: "{{ root }}/data/"
    version: "{{ webserver_git_version }}"
    force: true
  notify: restart webserver.service

- name: Deploy {{ role_name }}
  ansible.builtin.import_tasks: docker-compose-service.yml
  vars:
    service_description: NGINX Webserver Installation von Nils Lorenzen
