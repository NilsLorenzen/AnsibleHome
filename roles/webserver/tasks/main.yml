- name: copy systemd unit
  ansible.builtin.template:
    src: webserver.service.j2
    dest: /etc/systemd/system/webserver.service
    owner: root
    group: root
    mode: "644"
  notify: restart webserver.service

- name: create /data/webserver dir
  ansible.builtin.file:
    path: "{{ root }}"
    state: directory

- name: create /data/webserver/data dir
  ansible.builtin.file:
    path: "{{ root }}/data"
    state: directory

- name: copy nginx conf file
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ root }}/nginx.conf"
    owner: root
    group: root
    mode: "644"
  notify: restart webserver.service

- name: copy docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ root }}/docker-compose.yml"
    owner: root
    group: root
    mode: "644"
  notify: restart webserver.service

# force, damit lokale Abweichungen verworfen werden statt den Task scheitern
# zu lassen. Vorher wurde dafuer das ganze Verzeichnis geloescht und neu
# geklont, was bei jedem Lauf einen Restart ausgeloest hat.
- name: Git checkout from n1ls.wtf repo
  ansible.builtin.git:
    repo: "{{ webserver_git_repo }}"
    dest: "{{ root }}/data/"
    version: "{{ webserver_git_version }}"
    force: true
  notify: restart webserver.service

- name: start webserver.service
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    enabled: true
    name: webserver.service
  register: webserver_started
