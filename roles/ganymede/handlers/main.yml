- name: restart {{ role_name }}.service
  ansible.builtin.systemd:
    name: "{{ role_name }}.service"
    state: restarted
    daemon_reload: true


- name: restart data-{{ role_name }}-media.mount
  when: ganymede_media_started is not changed
  ansible.builtin.systemd:
    name: "data-{{ role_name }}-media.mount"
    state: restarted
