- name: Update repositories cache and install "cifs-utils" package
  ansible.builtin.apt:
    name: cifs-utils
    update_cache: false

# Der NAS-Mount muss laufen, bevor der Container startet. Die Mount-Unit enthält das
# NAS-Passwort (600) und ist deshalb unten per copy_exclude vom Spiegeln nach /data ausgenommen.
- name: copy mount file for {{ role_name }}_media volume
  ansible.builtin.template:
    src: data-{{ role_name }}-media.mount.j2
    dest: "/etc/systemd/system/data-{{ role_name }}-media.mount"
    owner: root
    group: root
    mode: "600"
  notify: restart data-{{ role_name }}-media.mount

- name: start data-{{ role_name }}-media.mount
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    enabled: true
    name: data-{{ role_name }}-media.mount
  register: ganymede_media_started

- name: Deploy {{ role_name }}
  ansible.builtin.import_tasks: docker-compose-service.yml
  vars:
    service_requires_mounts_for: "{{ mountpoint }}"
    copy_exclude:
      - data-{{ role_name }}-media.mount.j2
