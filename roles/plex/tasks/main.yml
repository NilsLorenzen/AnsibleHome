- name: Update repositories cache and install "cifs-utils" package
  ansible.builtin.apt:
    name: cifs-utils
    update_cache: false

# Der NAS-Mount muss laufen, bevor der Container startet. Die Mount-Unit enthält das
# NAS-Passwort (600) und ist deshalb unten per copy_exclude vom Spiegeln nach /data ausgenommen.
- name: copy mount file for plex_media volume
  ansible.builtin.template:
    src: data-plex-media.mount.j2
    dest: "/etc/systemd/system/data-plex-media.mount"
    owner: root
    group: root
    mode: "600"
  notify: restart data-plex-media.mount

- name: start data-plex-media.mount
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    enabled: true
    name: data-plex-media.mount
  register: plexmedia_started

# source: https://forums.plex.tv/t/ubuntu-intel-n5105-qsv-hw-transcoder-not-detected/803491/141?u=thomas_9
- name: copy initramfs conf file for enabling hardware transcoding
  ansible.builtin.template:
    src: i915.conf.j2
    dest: "/etc/modprobe.d/i915.conf"
    owner: root
    group: root
    mode: "644"
  notify: update initramfs

- name: Deploy {{ role_name }}
  ansible.builtin.import_tasks: docker-compose-service.yml
  vars:
    service_requires_mounts_for: "{{ mountpoint }}"
    copy_exclude:
      - data-plex-media.mount.j2
      - i915.conf.j2
