# Host-Dateien unter /etc schreibt die Rolle selbst, sie gehören nicht nach /data/pihole
# und sind deshalb unten per copy_exclude vom gemeinsamen Ablauf ausgenommen.
- name: deactivate systemd resolve - copy resolved.conf # restart required
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: "644"

- name: copy resolv.conf
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "644"

- name: Deploy {{ role_name }}
  ansible.builtin.import_tasks: docker-compose-service.yml
  vars:
    copy_exclude:
      - resolved.conf.j2
      - resolv.conf.j2
