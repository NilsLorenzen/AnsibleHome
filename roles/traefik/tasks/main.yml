# Die Compose-Datei erwartet das Netz als external, es muss vor dem Start existieren.
- name: Create docker network web
  community.docker.docker_network:
    name: web

- name: Deploy {{ role_name }}
  ansible.builtin.import_tasks: docker-compose-service.yml
  vars:
    file_mode: '640' # INWX-Credentials in der Compose-Datei
