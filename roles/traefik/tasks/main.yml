# Die Compose-Datei erwartet das Netz als external, es muss vor dem Start existieren.
- name: Create docker network web
  community.docker.docker_network:
    name: web

# Von den Dateien in templates/conf/dynamic/ werden nur die in traefik_dynamic_configs
# ausgerollt, alle anderen per copy_exclude übersprungen (und unten vom Host gelöscht).
- name: Deploy {{ role_name }}
  ansible.builtin.import_tasks: docker-compose-service.yml
  vars:
    file_mode: '640' # INWX-Credentials (dns) und Basic-Auth-Hashes in der Compose-Datei
    copy_exclude: >-
      {{ query('ansible.builtin.fileglob', role_path ~ '/templates/conf/dynamic/*.j2')
         | map('basename') | map('regex_replace', '\.j2$', '')
         | difference(traefik_dynamic_configs)
         | map('regex_replace', '^(.*)$', 'conf/dynamic/\1.j2') | list }}

# Kopiert wird nur, gelöscht nie: Was aus traefik_dynamic_configs (oder dem Repo) verschwindet,
# bliebe sonst samt seinen Routern auf dem Host aktiv. Kein Restart nötig, der File-Provider
# beobachtet das Verzeichnis (watch: true).
- name: Find dynamic configs of {{ role_name }}
  ansible.builtin.find:
    paths: "{{ root }}/conf/dynamic"
    hidden: true
  register: traefik_dynamic_found

- name: Remove dynamic configs not in traefik_dynamic_configs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ traefik_dynamic_found.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path | basename not in traefik_dynamic_configs
